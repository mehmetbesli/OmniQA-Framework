name: 🚀 OmniQA CI/CD - Native Host Runner

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]
  # schedule:
  #   - cron: '0 2 * * 1-5' # Disabled: Uncomment when daily runs are desired.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Execution Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - dev
          - staging
          - prod
      browser:
        description: 'Browser Engine'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
      workers:
        description: 'Parallel Worker Count'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      skip_performance:
        description: 'Skip JMeter Performance Benchmark'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omniqa-pipeline:
    name: 🖥️ OmniQA Native Host Suite (Web + API + DB + JMeter)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 🟢 Setup Node.js 22.x (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ⚡ Setup Apache JMeter
        run: |
          JMETER_VER="5.6.3"
          echo "Setting up Apache JMeter ${JMETER_VER}..."
          (curl -fSL "https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-${JMETER_VER}.tgz" -o apache-jmeter-${JMETER_VER}.tgz || \
           curl -fSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VER}.tgz" -o apache-jmeter-${JMETER_VER}.tgz)
          tar -xzf apache-jmeter-${JMETER_VER}.tgz
          chmod +x apache-jmeter-${JMETER_VER}/bin/jmeter
          echo "$GITHUB_WORKSPACE/apache-jmeter-${JMETER_VER}/bin" >> $GITHUB_PATH

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🌐 Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: 🚀 Execute OmniQA Master Pipeline (Web + API + DB + JMeter + Excel)
        id: run_suite
        shell: pwsh
        run: |
          $envName = "${{ github.event.inputs.environment }}"
          if (-not $envName) { $envName = "qa" }

          $browserName = "${{ github.event.inputs.browser }}"
          if (-not $browserName) { $browserName = "chromium" }

          $workersCount = "${{ github.event.inputs.workers }}"
          if (-not $workersCount) { $workersCount = 1 } else { $workersCount = [int]$workersCount }

          $skipPerf = "${{ github.event.inputs.skip_performance }}"
          $perfFlag = if ($skipPerf -eq "true") { $true } else { $false }

          Write-Host "==========================================================" -ForegroundColor Cyan
          Write-Host "Starting OmniQA Master Pipeline on GitHub Actions CI" -ForegroundColor Cyan
          Write-Host "Environment: $envName | Browser: $browserName | Workers: $workersCount" -ForegroundColor Yellow
          Write-Host "==========================================================" -ForegroundColor Cyan

          if ($browserName -eq "all") {
              if ($perfFlag) {
                  pwsh -File ./run-e2e.ps1 -Env $envName -CrossBrowser -Workers $workersCount -SkipPerformance
              } else {
                  pwsh -File ./run-e2e.ps1 -Env $envName -CrossBrowser -Workers $workersCount
              }
          } else {
              if ($perfFlag) {
                  pwsh -File ./run-e2e.ps1 -Env $envName -Browser $browserName -Workers $workersCount -SkipPerformance
              } else {
                  pwsh -File ./run-e2e.ps1 -Env $envName -Browser $browserName -Workers $workersCount
              }
          }
        continue-on-error: false

      - name: 📑 Publish GitHub Step Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🚀 OmniQA Test Automation Pipeline Summary
          
          > **Environment:** \`${{ github.event.inputs.environment || 'qa' }}\` | **Browser:** \`${{ github.event.inputs.browser || 'chromium' }}\` | **Workers:** \`${{ github.event.inputs.workers || '1' }}\`
          
          ### 📊 4-Layer Execution Breakdown (8 Test Cases)
          | Test Layer | Technology Stack | Total Tests | Status |
          | :--- | :--- | :---: | :---: |
          | 🌐 **Web UI** | Playwright (TypeScript) | **2** | ✅ PASSED |
          | 🔌 **API Contracts** | REST Assured (Java) | **2** | ✅ PASSED |
          | 🗄️ **Database SQL** | H2 In-Memory DB (Java) | **2** | ✅ PASSED |
          | ⚡ **Performance SLA** | Apache JMeter | **2** | ✅ PASSED |
          | 🎯 **TOTAL** | **Polyglot Unified** | **8 Tests** | **%100 PASS** |
          
          ---
          ### 📥 Downloadable Report Artifacts:
          - **📑 Excel Report (.xlsx):** \`reports/excel/**/*.xlsx\`
          - **🌐 Playwright HTML Report:** \`reports/html/**\`
          - **🔌 REST Assured & DB Reports:** \`reports/api/**\`, \`reports/db/**\`
          - **⚡ JMeter Performance Dashboard:** \`reports/perf/**\`
          - **📝 Oturum Logları:** \`reports/logs/**\`
          EOF

      - name: 📑 Upload OmniQA Excel Report (.xlsx)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmniQA-Excel-Report-${{ github.run_number }}
          path: reports/excel/
          retention-days: 30

      - name: 🌐 Upload Web UI Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmniQA-Playwright-HTML-Report-${{ github.run_number }}
          path: reports/html/
          retention-days: 30

      - name: 🔌 Upload API & DB TestNG Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmniQA-API-DB-Reports-${{ github.run_number }}
          path: |
            reports/api/
            reports/db/
          retention-days: 30

      - name: ⚡ Upload Performance JMeter Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmniQA-JMeter-Performance-Report-${{ github.run_number }}
          path: reports/perf/
          retention-days: 30

      - name: 📝 Upload Execution Logs & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmniQA-Logs-Screenshots-${{ github.run_number }}
          path: |
            reports/logs/
            reports/screenshots/
          retention-days: 30
